[package]
name = "hc-shell"
version = "0.1.0"
edition = "2021"
description = "House Calls native shell (Dioxus): the quote pad riding hc-engine directly"
license-file = "../LICENSE.md"

[dependencies]
dioxus = { version = "0.6" }
hc-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
