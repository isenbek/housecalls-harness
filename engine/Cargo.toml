[package]
name = "hc-engine"
version = "0.1.0"
edition = "2021"
description = "House Calls local-backend engine: schema/migrations, seed-phrase crypto, zero-knowledge stash envelope"
license-file = "../LICENSE.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bip39 = { version = "2.1", features = ["rand"] }
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
zeroize = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"
